name: validate

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cards/package-lock.json
      - run: npm ci
        working-directory: cards
      - run: npm run build
        working-directory: cards
      - name: dist matches the sources
        run: git diff --exit-code -- dist
